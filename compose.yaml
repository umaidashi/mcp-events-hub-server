# Local development only: dev tokens by default, and the hub accepts http callbacks to private
# addresses so it can reach the client container's webhook receiver.
x-client: &client
  build:
    context: .
    target: client
    secrets: [extra-ca]
  depends_on:
    hub:
      condition: service_healthy
  environment: &client-env
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    MCP_EVENTS_HUB_URL: http://hub:8787/mcp
    MCP_EVENTS_HUB_TOKEN: ${HUB_CLIENT_TOKEN:-dev-client}
    MCP_EVENTS_CALLBACK_HOST: 0.0.0.0
    MCP_EVENTS_CALLBACK_PORT: "9100"

x-watcher: &watcher
  build:
    context: .
    target: app
  depends_on:
    hub:
      condition: service_healthy
  environment: &watcher-env
    MCP_EVENTS_HUB_URL: http://hub:8787/mcp
    MCP_EVENTS_HUB_TOKEN: ${HUB_CLIENT_TOKEN:-dev-client}

services:
  hub:
    build:
      context: .
      target: app
    environment:
      HOST: 0.0.0.0
      HUB_DB: /data/hub.db
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:-dev-admin}
      HUB_CLIENT_TOKENS: pi:${HUB_CLIENT_TOKEN:-dev-client}
      HUB_ALLOW_PRIVATE_CALLBACKS: "1"
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - hub-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/admin').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  service:
    build:
      context: .
      target: app
    command: ["sh", "-c", "node mock/service.ts register && exec node mock/service.ts loop 3"]
    environment:
      HUB_URL: http://hub:8787
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:-dev-admin}
    depends_on:
      hub:
        condition: service_healthy

  # A small HTTP API that reports each 5xx it answers as api.error.occurred. Its own traffic loop
  # calls /orders/:id every 2 s and 20% of those calls fail; ?fail=critical|warning fails on demand.
  api:
    build:
      context: .
      target: app
    command: ["node", "mock/api-server.ts"]
    environment:
      HOST: 0.0.0.0
      HUB_URL: http://hub:8787
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:-dev-admin}
      API_FAILURE_RATE: "0.2"
      API_TRAFFIC_INTERVAL_SEC: "2"
    ports:
      - 127.0.0.1:8788:8788
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      # Probe every second while starting, then every 30 s so /health lines do not bury the log.
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # Lightweight subscribers without pi or an LLM: each one prints the events the hub delivers to it.
  # Watch them with: docker compose logs -f watch-push watch-poll watch-webhook watch-errors
  watch-push:
    <<: *watcher
    command: ["node", "scripts/watch.ts", "shop.order.created", '{"customer":"alice"}']
    environment:
      <<: *watcher-env
      MCP_EVENTS_DELIVERY: push

  watch-poll:
    <<: *watcher
    command: ["node", "scripts/watch.ts", "shop.order.created", '{"customer":"bob"}']
    environment:
      <<: *watcher-env
      MCP_EVENTS_DELIVERY: poll

  watch-webhook:
    <<: *watcher
    command: ["node", "scripts/watch.ts", "shop.order.created", "{}"]
    environment:
      <<: *watcher-env
      MCP_EVENTS_DELIVERY: webhook
      MCP_EVENTS_CALLBACK_HOST: 0.0.0.0
      MCP_EVENTS_CALLBACK_PORT: "9100"
      MCP_EVENTS_CALLBACK_URL: http://watch-webhook:9100

  watch-errors:
    <<: *watcher
    command: ["node", "scripts/watch.ts", "api.error.occurred", '{"severity":"critical"}']
    depends_on:
      hub:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *watcher-env
      MCP_EVENTS_DELIVERY: push

  client:
    <<: *client
    profiles: [client]
    stdin_open: true
    tty: true
    environment:
      <<: *client-env
      MCP_EVENTS_CALLBACK_URL: http://client:9100

  check:
    <<: *client
    profiles: [check]
    command: ["node", "scripts/pi-demo.ts"]
    environment:
      <<: *client-env
      MCP_EVENTS_CALLBACK_URL: http://check:9100
      PI_DEMO_INSTALLED: "1"
      PI_DEMO_HUB_URL: http://hub:8787
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN:-dev-admin}
      HUB_CLIENT_TOKEN: ${HUB_CLIENT_TOKEN:-dev-client}

volumes:
  hub-data:

secrets:
  extra-ca:
    environment: EXTRA_CA_CERTS_PEM
